<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provider Account Regression Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Also supports /@fs/ on the app's dev server, which bypasses HTML transforms.
      import RefreshRuntime from '/@react-refresh'
      if (!window.__vite_plugin_react_preamble_installed__) {
        RefreshRuntime.injectIntoGlobalHook(window)
        window.$RefreshReg$ = () => {}
        window.$RefreshSig$ = () => (type) => type
        window.__vite_plugin_react_preamble_installed__ = true
      }
    </script>
    <script type="module" src="./providers.tsx"></script>
  </body>
</html>
