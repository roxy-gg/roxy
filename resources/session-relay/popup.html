<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0e10;
        --surface: #161619;
        --border: #2a2a30;
        --text: #ededf0;
        --muted: #9a9aa5;
        --accent: #4d8dff;
        --danger: #f0556a;
        --ok: #3fb950;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.45 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11.5px;
        word-break: break-all;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
      }
      .row input {
        accent-color: var(--accent);
      }
      .count {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-radius: 7px;
        background: #fff;
        color: #000;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        font-weight: 500;
      }
      input[type='text'] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 4px;
        text-align: center;
      }
      input[type='text']:focus {
        outline: 0;
        border-color: var(--accent);
      }
      .msg {
        margin-top: 10px;
        font-size: 11.5px;
      }
      .msg.err {
        color: var(--danger);
      }
      .msg.ok {
        color: var(--ok);
      }
      .hint {
        margin-top: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 12px 0;
      }
      .stack > * + * {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
