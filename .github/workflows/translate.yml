name: Translate

# Manual only. Translation costs money and rewrites committed files, so it runs
# when a human asks — not on every push.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Comma-separated codes (blank = all non-English)'
        required: false
        default: ''
      model:
        description: 'OpenRouter model'
        required: false
        default: 'google/gemini-2.5-flash'
      redo_all:
        description: 'Re-translate strings that already have a translation'
        type: boolean
        required: false
        default: false
      open_pr:
        description: 'Open a pull request instead of pushing to this branch'
        type: boolean
        required: false
        default: true

concurrency:
  group: translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Nothing here needs the native modules or Electron — this job only reads
      # and writes JSON, so skip the install entirely.
      - name: Translate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it under Settings -> Secrets -> Actions."
            exit 1
          fi
          node script/i18n-translate.mjs \
            ${{ inputs.languages && format('--lang {0}', inputs.languages) || '' }} \
            --model "${{ inputs.model }}" \
            ${{ inputs.redo_all && '--all' || '' }}

      # The gate that matters: the translator validates each string as it goes,
      # but this re-checks the catalogs as a whole and fails the run rather than
      # committing something malformed.
      - name: Verify the catalogs still match default.json
        run: node script/i18n-sync.mjs

      - name: Report coverage
        run: node script/i18n-sync.mjs --json > /tmp/i18n.json || true

      - name: Nothing to do?
        id: diff
        run: |
          if git diff --quiet -- src/renderer/src/locales; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalogs already up to date - no commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true' && inputs.open_pr
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: src/renderer/src/locales
          branch: i18n/translations
          delete-branch: true
          commit-message: 'chore(i18n): refresh translations'
          title: 'chore(i18n): refresh translations'
          body: |
            Generated by the **Translate** workflow.

            - model: `${{ inputs.model }}`
            - languages: `${{ inputs.languages || 'all' }}`
            - re-translated everything: `${{ inputs.redo_all }}`

            Only strings that were missing or still English were sent. Each one
            was checked before landing: a translation that drops a
            `{{placeholder}}` or mangles an inline tag is rejected and the
            English is kept, so this should never merge a broken string — but
            it is machine output, so give the diff a skim.

      - name: Commit to this branch
        if: steps.diff.outputs.changed == 'true' && !inputs.open_pr
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/renderer/src/locales
          git commit -m 'chore(i18n): refresh translations'
          git push
